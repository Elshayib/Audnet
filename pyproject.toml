[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-audit"
version = "0.1.0"
description = "Network Security & Compliance State Auditor"
requires-python = ">=3.12"
dependencies = [
    "netmiko>=4.3.0",
    "textfsm>=1.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
net-audit = "net_audit.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
