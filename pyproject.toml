[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audnet"
dynamic = ["version"]
description = "Network Security & Compliance Auditor — automated SSH baseline checks to detect and prevent configuration drift"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Islam Elshayib", email = "Elshayib@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "netmiko>=4.3.0",
    "textfsm>=1.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "structlog>=24.0",
    "tenacity>=8.5.0",
    "asyncssh>=2.23.1",
    "GitPython>=3.1.0",
    "pysnmp>=7.0",
    "aiosmtplib>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
audnet = "audnet.cli:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/audnet"]
include = [
    "src/audnet/**/*.py",
    "src/audnet/templates/**/*",
    "src/audnet/textfsm_templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "textfsm.*",
    "yaml.*",
    "tenacity.*",
    "asyncssh.*",
    "git.*",
    "pysnmp.*",
    "aiosmtplib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paramiko.ssh_exception"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["audnet"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.4.0",
]
