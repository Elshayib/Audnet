defaults:
  username: admin
  device_type: cisco_ios
  port: 22
  timeout: 30

devices:
  - name: core-rtr-01
    host: 192.168.1.1
    password: "${CORE_RTR_01_PASSWORD}"

  - name: dist-sw-01
    host: 192.168.1.2
    device_type: cisco_nxos
    password: "${DIST_SW_01_PASSWORD}"

  - name: edge-fw-01
    host: 192.168.1.3
    use_keys: true
    key_file: ~/.ssh/audnet_id_ed25519
