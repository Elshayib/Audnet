# Auto-label configuration for PRs based on changed paths
# Format for actions/labeler@v5

enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - src/**/*
          - '!src/**/.github/**/*'

bug:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*

chore:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - pyproject.toml
          - '*.lock'
          - '*.toml'
          - uv.lock

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**/*
          - .github/ISSUE_TEMPLATE/**/*

security:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - src/net_audit/**/*

collector:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/collector.py

cli:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/cli.py

compliance:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/compliance.py

parser:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/parser.py

models:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/models.py

config:
  - changed-files:
      - any-glob-to-any-file:
          - src/net_audit/config.py

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*
