name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      python-version: "3.14"
      run-matrix-tests: true
    permissions:
      contents: read
      security-events: write

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync build tooling
        run: uv sync --locked --extra dev

      - name: Build wheel and sdist
        run: uv build

      - name: Install wheel into clean venv and smoke-test CLI
        env:
          SMOKE_DEVICE_PASSWORD: smoke-not-real
        run: |
          set -euo pipefail
          uv venv .smoke-venv
          # Install the built wheel only (not editable / not from src/)
          uv pip install --python .smoke-venv dist/*.whl
          .smoke-venv/bin/audnet --version
          .smoke-venv/bin/audnet audit \
            --inventory tests/fixtures/smoke/devices.yaml \
            --baseline tests/fixtures/smoke/baseline.yaml \
            --dry-run

  docker-smoke:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: audnet:ci-smoke
          build-args: |
            AUDNET_VERSION=0.0.0+ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run audnet --version in container
        run: |
          docker run --rm --entrypoint audnet audnet:ci-smoke --version
